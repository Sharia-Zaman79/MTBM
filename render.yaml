services:
  - type: web
    name: mtbm
    runtime: node
    buildCommand: npm run render-build
    startCommand: cd server && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: MTBM
